<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>はま寿司</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="nav-container">
            <div class="nav-left">
                <a href="#" class="nav-btn">TOP</a>
            </div>
            <div class="nav-right">
                <a href="#" class="nav-btn">menu</a>
                <a href="#" class="nav-btn">information</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="blue-box">
            <div class="label-wrapper">
                <h1 class="white-label">はま寿司</h1>
            </div>
            <div class="content-inner">
                <img src="your-image.jpg" alt="店舗外観" class="main-img">
            </div>
        </section>

        <section class="blue-box">
            <div class="label-wrapper">
                <h2 class="white-label">紹介</h2>
            </div>
            <div class="content-inner">
                <div class="text-area">
                    <p>はま寿司は、新鮮な素材の持ち味を大切にし、丁寧に仕上げたお寿司を気軽に楽しめるお店です。</p>
                    <p>一皿一皿に込めたこだわりと、心地よく過ごせる落ち着いた空間で、どなたでも安心してお食事をお楽しみいただけます。</p>
                    <p>旬の味わいを引き出した多彩なメニューとともに、ほっと一息つける時間を提供します。</p>
                    <p>ご家族でも、おひとりでも、心とお腹を満たすひとときをお過ごしください。</p>
                </div>
            </div>
        </section>
    </main>

</body>
